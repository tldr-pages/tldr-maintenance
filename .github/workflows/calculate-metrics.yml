name: Calculate Metrics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # The tldr submodule.
      - tldr
      - .github/workflows/calculate-metrics.yml
      - scripts/*.sh
      - scripts/*.py
      - scripts/metrics.tsv
      # The linters.
      - package.json
      - package-lock.json
      - '!scripts/sort-lychee-output.py'

jobs:
  calculate-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    name: Calculate Metrics

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true

      # The scripts only use the standard library of Python.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # The results are uploaded with *.txt, requirements.txt (the linters of this repository) isn't a result.
      - name: Remove requirements.txt
        run: rm requirements.txt

      - name: Run the script and generate artifacts
        # The bash shell uses pipefail, so the step fails when one of the checks failed to run.
        shell: bash
        run: |
          status=0
          npm run --silent calculate-metrics 2>&1 | tee metrics-log.md || status=$?
          cat metrics-log.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload Calculate Metrics artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metrics
          path: |
            metrics-log.md
            summary.tsv
            *.txt
            check-pages*/

      - name: Create metrics.zip
        if: github.ref == 'refs/heads/main'
        run: zip -r metrics.zip metrics-log.md summary.tsv *.txt check-pages*/

      - name: Delete artifacts from GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: mknejp/delete-release-assets@03294a667e97911b5883d3028f277a0b4441edfb # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest
          fail-if-no-assets: false
          fail-if-no-release: false
          assets: |
            metrics-log.md
            summary.tsv
            *.txt
            metrics.zip

      - name: Upload artifacts to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: latest
          files: |
            metrics-log.md
            summary.tsv
            *.txt
            metrics.zip

      - name: Update Translation Dashboard Status Issue
        if: github.repository == 'tldr-pages/tldr-maintenance' && github.ref == 'refs/heads/main'
        run: python3 scripts/update-dashboard-issue.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Language-specific Translation Dashboard Status Issues
        if: github.repository == 'tldr-pages/tldr-maintenance' && github.ref == 'refs/heads/main'
        run: python3 scripts/update-language-issues.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
