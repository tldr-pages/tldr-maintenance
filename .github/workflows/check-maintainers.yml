name: Check maintainers

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # once a month

permissions:
  contents: read

jobs:
  check-maintainers:
    runs-on: ubuntu-latest

    name: Check maintainers

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Generate the report
        run: |
          npm run --silent check-maintainers > maintainers-report.md
          cat maintainers-report.md >> "$GITHUB_STEP_SUMMARY"
        env:
          # Private members, outside collaborators and 2FA are only visible to owners.
          GITHUB_TOKEN: ${{ secrets.MAINTAINERS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintainers-report
          path: maintainers-report.md
